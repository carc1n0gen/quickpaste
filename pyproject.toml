[project]
name = "quickpaste"
version = "0.1.0"
description = "dead simple code snippet sharing"
authors = [
    {name = "Carson Evans", email = "carsonwevans@gmail.com"}
]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "flask-pymongo (>=3.0.1,<4.0.0)",
    "flask-wtf (>=1.3.0,<2.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "pygments (>=2.20.0,<3.0.0)",
    "waitress (>=3.0.2,<4.0.0)",
    "flask-limiter (>=4.1.1,<5.0.0)",
]

[project.scripts]


[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "coverage (>=7.14.3,<8.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.poetry]
packages = [{include = "quickpaste", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src/quickpaste/"]
